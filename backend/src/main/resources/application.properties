# --- Configuration Serveur ---
server.port=8080

# --- Configuration Base de Données MySQL (WAMP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/auximad_immo?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuration JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Configuration JWT ---
jwt.secret=MaCleSecreteTresLonguePourAuximadQuiDoitEtreSecurisee2026!
jwt.expiration=86400000

# --- Configuration Upload Fichiers (Photos) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Upload de fichiers ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads