# ============================================================
# Profil de test — base H2 en mémoire, aucun contact avec MySQL
# ============================================================
#
# Ce profil est activé par @ActiveProfiles("test") sur les tests
# d'intégration. Il isole totalement la suite du MySQL de développement
# (auximad_immo) : la base est recréée à chaque démarrage de contexte et
# détruite à l'arrêt.

spring.datasource.url=jdbc:h2:mem:auximad_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Secret JWT de test : Base64 valide (JwtUtils décode la valeur avant de
# construire la clé HMAC). Ne jamais réutiliser cette clé hors tests.
jwt.secret=VGVzdFNlY3JldEtleUZvckF1eGltYWRJbnRlZ3JhdGlvblRlc3RzLTIwMjYtMDEyMzQ1Njc4OUFCQ0RFRg==
jwt.expiration=86400000

# Les QR codes générés pendant les tests restent dans target/ (jamais dans
# le dossier uploads/ réel).
file.upload-dir=target/test-uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
